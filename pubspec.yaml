name: voice_saathi
description: "Voice helper for elderly parents: press one button and speak in Telugu, Hindi or English. Everything stays on the phone."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  flutter_tts: ^4.2.5
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  intl: ^0.20.2
  meta: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
