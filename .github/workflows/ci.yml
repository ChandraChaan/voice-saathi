name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Check generated localisations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code lib/l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Check the release APK has no internet permission
        run: |
          flutter build apk --release
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::The release APK asks for INTERNET; the app must work without it."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
