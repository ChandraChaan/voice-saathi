name: Release APKs

# Push a tag like v1.0.0 to build APKs and attach them to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      # Signs with the release key when the repository has these secrets;
      # otherwise android/app/build.gradle.kts falls back to the debug key.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build-symbols
          flutter build apk --release --obfuscate --split-debug-info=build-symbols
          cd build/app/outputs/flutter-apk
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p ../release
          cp app-arm64-v8a-release.apk "../release/VoiceSaathi-$VERSION-arm64-v8a.apk"
          cp app-armeabi-v7a-release.apk "../release/VoiceSaathi-$VERSION-armeabi-v7a.apk"
          cp app-release.apk "../release/VoiceSaathi-$VERSION-universal.apk"
          cd ../release
          sha256sum *.apk > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: voice-saathi-apks
          path: build/app/outputs/release/*

      - name: Attach APKs to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/release/*
